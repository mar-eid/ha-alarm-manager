[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ha-alarm-manager"
version = "0.19.1"
description = "SCADA-style alarm management system for Home Assistant"
requires-python = ">=3.13"
license = "MIT"
dependencies = [
    "aiosqlite>=0.20.0",
]

[tool.setuptools.packages.find]
include = ["custom_components*", "tests*"]

[project.optional-dependencies]
dev = [
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-homeassistant-custom-component>=0.13.0",
    "pytest-cov>=6.0.0",
]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "TCH"]

[tool.ruff.lint.isort]
known-first-party = ["custom_components.scada_alarm_manager"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# On Windows, the HA test harness plugin fails (missing fcntl).
# Disable it here; tests use fallback fixtures from tests/conftest.py.
# On Linux/CI, remove this line to use the full HA integration test harness.
addopts = "-p no:homeassistant"

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
