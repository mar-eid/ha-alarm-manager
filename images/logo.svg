           fill="#FF9800" stroke="#FF5722" stroke-width="1"/>

  <!-- Status dots - priority colors -->
  <circle cx="55" cy="160" r="8" fill="#F44336"/>
  <circle cx="80" cy="168" r="6" fill="#FF5722"/>
  <circle cx="102" cy="172" r="5" fill="#FF9800"/>
  <circle cx="122" cy="170" r="4" fill="#2196F3"/>

  <!-- Signal waves -->
  <path d="M35 80 Q25 70 35 60" fill="none" stroke="#03a9f4" stroke-width="2.5" opacity="0.5"/>
  <path d="M25 85 Q10 70 25 55" fill="none" stroke="#03a9f4" stroke-width="2" opacity="0.3"/>
  <path d="M165 80 Q175 70 165 60" fill="none" stroke="#03a9f4" stroke-width="2.5" opacity="0.5"/>
  <path d="M175 85 Q190 70 175 55" fill="none" stroke="#03a9f4" stroke-width="2" opacity="0.3"/>
</svg>
