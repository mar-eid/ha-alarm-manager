  <circle cx="100" cy="100" r="96" fill="#1c1c2e" stroke="#03a9f4" stroke-width="3"/>

  <!-- Alarm bell body -->
  <path d="M100 40 C70 40 50 65 50 95 L50 115 L40 125 L40 135 L160 135 L160 125 L150 115 L150 95 C150 65 130 40 100 40Z"
        fill="#03a9f4" opacity="0.9"/>

  <!-- Bell clapper -->
  <circle cx="100" cy="145" r="10" fill="#03a9f4"/>

  <!-- Lightning bolt (alarm trigger) -->
